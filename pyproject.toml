[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerbhud"
version = "0.17.14"
description = "Overlay de Sim Racing para iRacing e Le Mans Ultimate (Etapa 1: camada de dados)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
kerbhud = "kerbhud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
