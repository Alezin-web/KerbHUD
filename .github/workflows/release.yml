# Publica um Release com o .exe pronto, sem ninguém precisar gerar nada no próprio PC.
# Dois jeitos de disparar:
#   1) Pelo site: aba Actions → "release" → botão "Run workflow" (usa a versão de src/kerbhud/__init__.py e cria a tag vX.Y.Z).
#   2) Pelo git:  git tag v0.17.2 && git push origin v0.17.2   (a tag precisa bater com a versão do código).
# (NÃO foi testado pelo autor: o 1º uso pode pedir um pequeno ajuste; veja o log na aba Actions do repositório.)
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler a versão do código
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/kerbhud/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if ("${{ github.event_name }}" -eq "push" -and "v$v" -ne "${{ github.ref_name }}") {
            Write-Error "tag ${{ github.ref_name }} != versão $v do código"; exit 1
          }
      - run: pip install -r requirements-build.txt
      - name: Testes
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests
      - name: Notas do release (CHANGELOG PT + EN)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python tools/release_notes.py "${{ steps.ver.outputs.version }}" "${{ github.repository }}" release-notes.md
      - run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build_exe/work build_exe/KerbHUD.spec
      - name: Empacotar
        shell: pwsh
        run: |
          Compress-Archive -Path dist/KerbHUD/* -DestinationPath KerbHUD-windows.zip
          git archive --format=zip -o KerbHUD-source.zip HEAD
          foreach ($f in "KerbHUD-windows.zip","KerbHUD-source.zip") {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii "$f.sha256"
          }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: KerbHUD v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            KerbHUD-windows.zip
            KerbHUD-windows.zip.sha256
            KerbHUD-source.zip
            KerbHUD-source.zip.sha256
